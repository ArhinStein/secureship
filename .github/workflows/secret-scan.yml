name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download gitleaks
        run: |
          VERSION=8.18.4
          BASE=https://github.com/gitleaks/gitleaks/releases/download
          URL="$BASE/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$URL" | tar -xz gitleaks

      - name: Scan every commit for secrets
        run: ./gitleaks detect --source . -v
